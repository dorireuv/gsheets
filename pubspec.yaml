name: gsheets
description: A library for working with Google Sheets API v4.
  Manage your spreadsheets with gsheets in Dart.
version: 0.4.3
homepage: https://github.com/a-marenkov/gsheets
repository: https://github.com/a-marenkov/gsheets.git
issue_tracker: https://github.com/a-marenkov/gsheets/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  http: ^1.1.0
  meta: ^1.17.0
  collection: ^1.19.1

dev_dependencies:
  pedantic: ^1.11.1
  test: ^1.20.2
